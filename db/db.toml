# Data Source Name. When set, it is used as-is and the connection fields
# below (username ... parseTime, and [db.Timeout]) are ignored.
[db]
dsn = ""
username = "xx"
password = "xx"
protocol = "tcp"
host = "127.0.0.1"
port = 3306
database = "xx"
parseTime = true

# milliseconds
[db.Timeout]
timeout = 1500
readTimeout = 1500
writeTimeout = 1500

[db.Conn]
maxOpenConns = 10
maxIdleConns = 5
# milliseconds
connMaxLifeTime = 600000
